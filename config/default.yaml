# auto-content-pipeline v3 默认配置

# v3 的唯一必需配置。可在 config/user.yaml 里覆盖，不要改这里。
package:
  output_dir: ~/Documents/Obsidian Vault/00-转型·一人事业/04-原创写作专区/发布包
  body_image_count: 2
  # 未自动识别中文字体时，填本机 CJK 字体路径；macOS 默认无需设置。
  font_path: ""

vault:
  # ingest 来源：用户手动写的草稿
  drafts_dir: ~/Documents/Obsidian Vault/00-转型·一人事业/04-原创写作专区/草稿
  # store 目标：打磨好的"价值文章"
  value_dir: ~/Documents/Obsidian Vault/00-转型·一人事业/04-原创写作专区/价值文章
  # scan 子流程存储（v1 兼容）
  legacy_briefs_dir: ~/Documents/Obsidian Vault/07-选题与发布/_briefs
  legacy_drafts_dir: ~/Documents/Obsidian Vault/07-选题与发布/_drafts

style_templates:
  dir: templates/style-templates
  # 3 个必选模板
  gongzhonghao: 公众号.md
  wanghong: 网红.md
  jike: 极客.md

review:
  # 每个模板的权重（总分 = 加权和）
  weights:
    gongzhonghao: 0.4
    wanghong: 0.3
    jike: 0.3
  # 评分低于这个分数的维度会被 mark 为"必须改"
  min_dim_score: 6.0
  # review 阶段最多返回多少条改稿建议
  max_suggestions: 10

modify:
  # modify 阶段是否允许重写整段
  allow_rewrite: true
  # 是否保留原稿作为 reference
  keep_original: true
  # 改动超过这个比例的段落视为重写（提示用户）
  rewrite_threshold: 0.6

illustrate:
  cover:
    aspect: "3:4"
    size: "1242x1660"
    provider: openai
    style_file: templates/style-templates/cover-default.md
  body_images:
    count: 2      # 正文配图数量
    style: minimal-diagram  # minimal-diagram | flat-illustration | screenshot
    placement: after_each_section  # after_each_section | inline_with_text

store:
  # store 时是否覆盖同名目录
  overwrite: false
  # 是否在 vault 价值文章目录生成 _index.md
  update_index: true

publish:
  # 可用平台
  platforms:
    xiaohongshu:
      enabled: true
      method: xiaohongshu_poster
      script: ~/.openclaw/workspace/xiaohongshu_poster.py
    juejin:
      enabled: false         # 需配置 cookie
      method: api
      api_base: https://api.juejin.cn
      auth: cookie
    sspai:
      enabled: false         # 少数派，需登录态
      method: api
      api_base: https://sspai.com/api
      auth: cookie
    zhihu:
      enabled: false         # 知乎，需登录态
      method: api
      api_base: https://www.zhihu.com/api/v4
      auth: cookie
    gongzhonghao:
      enabled: false         # ⏸ 等待 AppID/AppSecret，**不走浏览器**
      method: api
      api_base: https://api.weixin.qq.com/cgi-bin
      auth: appid_appsecret
      pending_credentials: true
  # 默认发布平台列表
  default_platforms: [xiaohongshu]
  # 发布前是否需要用户最后确认
  require_human_approval: true

cron:
  # v2 默认不跑定时，user-triggered 为主
  scan_legacy: false   # v1 的 scan 是否还跑
  review_daily: false  # v1 的 review 是否还跑
  tz: Asia/Shanghai

# v2.1: 飞书云文档审阅循环
feishu:
  # 审阅人 chat_id（飞书 P2P/群 chat_id）
  # 二选一填一个；推荐填 reviewer_chat_id（稳定）
  reviewer_chat_id: ""          # 例如: oc_xxxx
  reviewer_user_open_id: ""     # 备选: ou_xxxx（脚本会自动解析成 chat_id）

  # 云空间根目录下的"审核中"文件夹路径
  audit_folder: "auto-content-pipeline/审核中"

  # 云文档标题前缀
  title_prefix: "📝 审阅:"

  # dry-run 模式（只打印不实际推送）
  dry_run: false

  # 飞书评论识别关键词（按需调整）
  pass_keywords:
    - "确认发布"
    - "通过"
    - "approved"
    - "approve"
    - "ok 发布"
  reject_keywords:
    - "打回"
    - "重写"
    - "退回"
    - "reject"
    - "不通过"
    - "重新"
